<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>World Builder Studio</title>
  <!-- Tailwind CSS via Play CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Custom Styles -->
  <link rel="stylesheet" href="style.css" />
  <!-- Application Logic -->
  <script src="app.js" defer></script>
</head>
<body class="h-screen w-screen overflow-hidden bg-slate-950 text-slate-100 select-none font-sans">

  <!-- Main Workspace -->
  <div class="relative h-full w-full flex">

    <!-- Collapsible Asset Sidebar -->
    <aside id="asset-sidebar" class="sidebar-transition relative z-20 h-full w-72 bg-slate-900/95 backdrop-blur-md border-r border-slate-800 flex flex-col shadow-2xl">
      <!-- Sidebar Header -->
      <div class="p-4 border-b border-slate-800 flex items-center justify-between">
        <div>
          <h1 class="text-sm font-bold tracking-wider uppercase text-amber-400">World Builder</h1>
          <p class="text-xs text-slate-400">Drag assets onto the map</p>
        </div>
        <button id="toggle-sidebar-btn" title="Toggle Sidebar" class="p-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 transition">
          <svg id="sidebar-chevron" class="w-4 h-4 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
          </svg>
        </button>
      </div>

      <!-- Search Filter -->
      <div class="p-3 border-b border-slate-800">
        <input
          id="asset-search"
          type="text"
          placeholder="Filter terrain, cities, icons..."
          class="w-full px-3 py-1.5 text-xs bg-slate-950 border border-slate-700 rounded-lg focus:outline-none focus:border-amber-400 text-slate-200 placeholder-slate-500"
        />
      </div>

      <!-- Asset Grid Container (Populated by app.js) -->
      <div id="asset-library" class="flex-1 overflow-y-auto p-3 space-y-5 custom-scrollbar"></div>
    </aside>

    <!-- Floating Re-open Button (Visible when sidebar is collapsed) -->
    <button
      id="expand-sidebar-btn"
      title="Expand Assets"
      class="hidden fixed top-4 left-4 z-30 p-2.5 rounded-xl bg-slate-900/90 border border-slate-700 text-amber-400 hover:bg-slate-800 shadow-xl backdrop-blur-md transition"
    >
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>

    <!-- Map Viewport -->
    <main id="map-viewport" class="relative flex-1 h-full overflow-hidden bg-[#1b1916] cursor-default">
      <!-- Transformable World Stage -->
      <div id="world-stage" class="origin-top-left absolute top-0 left-0 w-[3000px] h-[2000px] parchment-bg shadow-2xl border border-amber-900/40">
        <!-- Grid Overlay -->
        <div id="grid-overlay" class="absolute inset-0 pointer-events-none map-grid"></div>
        <!-- Placed Assets Layer -->
        <div id="placed-assets-layer" class="absolute inset-0"></div>
      </div>

      <!-- Floating Navigation Toolbar -->
      <div class="fixed bottom-6 left-1/2 -translate-x-1/2 z-30 flex items-center gap-1.5 px-3 py-2 rounded-2xl bg-slate-900/90 backdrop-blur-md border border-slate-700/80 shadow-2xl">
        <!-- Select Tool -->
        <button data-tool="select" class="tool-btn active-tool flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-medium transition" title="Select & Move (V)">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5" />
          </svg>
          <span>Select</span>
        </button>

        <!-- Pan Tool -->
        <button data-tool="pan" class="tool-btn flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-medium text-slate-300 hover:bg-slate-800 transition" title="Pan Map (H or Space)">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 11.5V14m0-2.5v-6a1.5 1.5 0 113 0m-3 6a1.5 1.5 0 00-3 0v2a7.5 7.5 0 0015 0v-5a1.5 1.5 0 00-3 0m-6-3V11m0-5.5v-1a1.5 1.5 0 013 0v1m0 0V11m0-5.5a1.5 1.5 0 013 0v3m0 0V11" />
          </svg>
          <span>Pan</span>
        </button>

        <!-- Zoom Tool -->
        <button data-tool="zoom" class="tool-btn flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-medium text-slate-300 hover:bg-slate-800 transition" title="Click to Zoom In / Alt+Click to Zoom Out (Z)">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v6m3-3H7" />
          </svg>
          <span>Zoom</span>
        </button>

        <div class="h-5 w-px bg-slate-700 mx-1"></div>

        <!-- Zoom Controls -->
        <button id="zoom-out-btn" class="p-1.5 rounded-lg text-slate-300 hover:bg-slate-800 transition" title="Zoom Out (-)">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4" />
          </svg>
        </button>
        <span id="zoom-readout" class="text-xs font-mono text-slate-300 w-12 text-center">100%</span>
        <button id="zoom-in-btn" class="p-1.5 rounded-lg text-slate-300 hover:bg-slate-800 transition" title="Zoom In (+)">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
          </svg>
        </button>
        <button id="reset-view-btn" class="px-2 py-1 rounded-lg text-[11px] font-medium text-slate-400 hover:text-white hover:bg-slate-800 transition" title="Reset View (0)">
          Reset
        </button>

        <div class="h-5 w-px bg-slate-700 mx-1"></div>

        <!-- Delete Selected Asset -->
        <button id="delete-asset-btn" disabled class="p-1.5 rounded-lg text-rose-400 hover:bg-rose-950/60 disabled:opacity-30 disabled:pointer-events-none transition" title="Delete Selected (Del)">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
          </svg>
        </button>
      </div>
    </main>
  </div>

</body>
</html>
